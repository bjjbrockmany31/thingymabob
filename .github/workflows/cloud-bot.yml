name: Paper trader cloud updates and dashboard

on:
  schedule:
    # Runs every 15 minutes on weekdays.
    - cron: '7,22,37,52 13-22 * * 1-5'

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'run_cloud.py'
      - 'bot_core.py'
      - 'docs/**'
      - '.github/workflows/cloud-bot.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: paper-trader-cloud
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run paper trading bot
        run: python run_cloud.py

      - name: Save updated bot data
        run: |
          git config user.name "paper-trader-cloud-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data docs/data

          if ! git diff --cached --quiet; then
            git commit -m "Update simulated market snapshot [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rebuild website
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
